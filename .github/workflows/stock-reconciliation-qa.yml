name: Stock Reconciliation QA

on:
  push:
    branches:
      - feat/stock-reconciliation-foundation
      - feat/stock-reconciliation-posting
      - feat/stock-reconciliation-reporting
      - feat/stock-reconciliation-inventory-history
      - feat/stock-reconciliation-controls
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-reconciliation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: carton_erp_test
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: carton_erp_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, sqlite3, pdo_sqlite, bcmath, intl, curl
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: PHP syntax check
        run: |
          php -l app/Models/StockReconciliation.php
          php -l app/Models/StockReconciliationItem.php
          php -l app/Models/StockAdjustment.php
          php -l app/Models/StockAdjustmentItem.php
          php -l app/Services/StockReconciliationService.php
          php -l app/Http/Controllers/Admin/StockReconciliationController.php
          php -l database/migrations/2026_09_21_010000_create_stock_reconciliations_table.php
          php -l database/migrations/2026_09_21_010100_create_stock_reconciliation_items_table.php
          php -l database/migrations/2026_09_21_020000_add_reconciliation_adjustments_to_purchase_items.php
          php -l database/migrations/2026_09_21_020100_create_stock_adjustments_tables.php

      - name: Fresh MySQL install
        run: php artisan migrate:fresh --seed --force

      - name: Compile views
        run: php artisan view:cache

      - name: Focused stock reconciliation tests
        run: |
          php artisan test tests/Feature/Inventory/StockReconciliationFoundationTest.php
          php artisan test tests/Feature/Inventory/StockReconciliationUiContractTest.php

      - name: Complete PHP test suite
        run: php artisan test

      - name: Composer security audit
        run: composer audit --no-interaction
