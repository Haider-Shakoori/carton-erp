name: Financial + Inventory Release Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'database/**'
      - 'resources/views/**'
      - 'routes/**'
      - 'tests/**'
      - '.github/workflows/financial-inventory-release-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-inventory:
    name: Financial, inventory, access, CSV and operations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: carton_erp_test
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      COMPOSER_NO_AUDIT: "1"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: carton_erp_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel
          MYSQL_ROOT_PASSWORD: root
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, intl, curl
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare fresh isolated factory database
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"
          php artisan migrate:fresh --seed --force
      - name: Confirm seeded factories, BOM reviews and finance mappings
        run: |
          php artisan route:list --path=admin/products > /tmp/catalog-routes.txt
          php artisan view:cache
          php artisan erp:readiness
      - name: Run full release-critical functional + financial matrix
        shell: bash
        run: |
          set -o pipefail
          php artisan test \
            tests/Feature/ProductCatalog/FinishedGoodsCsvImportTest.php \
            tests/Feature/FinancialLogic/FinancialReleaseInvariantsTest.php \
            tests/Feature/Enterprise/AccountingControlTest.php \
            tests/Feature/Enterprise/ProductionCostVarianceTest.php \
            tests/Feature/GoldenPath/RealWorldCartonWorkflowRemediationTest.php \
            tests/Feature/Inventory/ReelRemnantTrackingTest.php \
            tests/Feature/Enterprise/BusinessUnitAccessControlTest.php \
            tests/Feature/ClientMaster/CustomerCartonMasterSeederTest.php \
            tests/Feature/Enterprise/BomGovernanceTest.php \
            tests/Feature/Security/ClientPortalAuthorizationTest.php \
            tests/Feature/ClientRequirements/SaleOrderModernUiContractTest.php \
            | tee financial-inventory-smoke.log
      - name: Archive focused QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-inventory-smoke
          path: |
            financial-inventory-smoke.log
            /tmp/catalog-routes.txt
          if-no-files-found: ignore
