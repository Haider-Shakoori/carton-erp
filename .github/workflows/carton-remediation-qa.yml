name: Carton ERP Remediation QA

on:
  push:
    branches:
      - fix/golden-path-remediation-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: carton_erp_test
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: carton_erp_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, sqlite3, pdo_sqlite, bcmath, intl, curl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: PHP syntax check changed core files
        run: |
          php -l app/Models/Purchase.php
          php -l app/Models/PurchaseItem.php
          php -l app/Models/Product.php
          php -l app/Models/BOM.php
          php -l app/Models/BOMItem.php
          php -l app/Models/SaleItem.php
          php -l app/Services/BOMCostingService.php
          php -l app/Http/Controllers/Admin/PurchaseExpenseController.php
          php -l app/Http/Controllers/Admin/BOMController.php
          php -l app/Http/Controllers/Admin/SaleController.php
          php -l database/migrations/2026_09_19_210000_repair_bom_item_formula_schema.php

      - name: Verify clean MySQL install
        run: php artisan migrate:fresh --seed --force

      - name: Run real-world remediation golden path
        run: php artisan test tests/Feature/GoldenPath/RealWorldCartonWorkflowRemediationTest.php
