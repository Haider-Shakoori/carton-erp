name: Refresh Frontend Lockfile

on:
  push:
    branches:
      - chore/protect-main-with-enterprise-qa

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Apply non-breaking npm security fixes
        run: npm audit fix --package-lock-only

      - name: Verify clean install
        run: npm ci

      - name: Verify frontend security
        run: npm audit --audit-level=high

      - name: Verify frontend build
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "Fix frontend dependency advisories [frontend-lock]"
          git push origin HEAD:chore/protect-main-with-enterprise-qa
