name: Actual Production Quantity QA

on:
  push:
    branches:
      - main
      - feat/actual-production-quantity-20260920
      - feat/production-completion-actuals-v2
      - feat/production-completion-consumption-ux
      - test/real-client-cnp-uat
      - feat/all-finished-goods-boms-clean-currencies
      - feat/seed-opening-stock-and-bom-usage
      - feat/sale-order-modern-ui
      - feat/sale-order-selected-item-panel
      - feat/production-completion-workspace
      - feat/business-unit-switching
      - feat/enterprise-controls
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actual-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: carton_erp_test
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: carton_erp_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: laravel
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, sqlite3, pdo_sqlite, bcmath, intl, curl
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Frontend security audit
        run: npm audit --audit-level=high

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: PHP syntax check
        run: |
          php -l app/Services/ProductionQuantityService.php
          php -l app/Services/StockDeductionService.php
          php -l app/Services/ProductionService.php
          php -l app/Http/Controllers/Admin/ProductionOrderController.php
          php -l app/Http/Controllers/Admin/SaleController.php
          php -l app/Http/Controllers/Admin/RemittanceController.php
          php -l database/seeders/CustomerCartonSizeSeeder.php
          php -l database/seeders/CustomerCartonBomSeeder.php
          php -l database/seeders/DatabaseSeeder.php
          php -l database/seeders/CurrencySeeder.php
          php -l database/seeders/ClientCartonOpeningStockSeeder.php
          php -l app/Services/BOMCostingService.php
          php -l app/Services/CartonSpecificationService.php
          php -l app/Models/ProductionOrder.php
          php -l app/Models/Sale.php
          php -l app/Models/SaleItem.php
          php -l database/migrations/2026_09_20_073000_add_ordered_qty_to_sale_items.php
          php -l database/migrations/2026_09_21_000000_add_production_completion_quantities.php
          php -l app/Services/ProductionControlService.php
          php -l app/Services/InventoryLocationService.php
          php -l app/Services/ProcurementService.php
          php -l app/Services/AccountingService.php
          php -l app/Services/BOMGovernanceService.php
          php -l app/Services/ManagementReportingService.php
          php -l app/Services/StockControlNotificationService.php
          php -l app/Http/Controllers/Admin/StockNotificationController.php
          php -l app/Jobs/DeliverStockControlNotification.php
          php -l app/Models/StockNotificationDelivery.php
          php -l app/Models/StockNotificationPreference.php
          php -l app/Models/User.php
          php -l app/Http/Controllers/Admin/AccountingController.php
          php -l app/Http/Controllers/Admin/ManagementReportingController.php
          php -l app/Http/Middleware/InitializeBusinessUnitContext.php
          php -l app/Console/Commands/EnterpriseReadinessCheck.php
          php -l database/migrations/2026_09_22_080000_add_production_control_and_audit.php
          php -l database/migrations/2026_09_22_083000_create_financial_accounting_controls.php
          php -l database/migrations/2026_09_22_084000_create_business_unit_user_access.php
          php -l database/migrations/2026_09_22_085000_add_bom_revision_governance.php
          php -l database/migrations/2026_09_22_091000_add_assignment_stock_notification_preference.php

      - name: Fresh MySQL install
        run: php artisan migrate:fresh --seed --force

      - name: Compile views
        run: php artisan view:cache

      - name: Enterprise readiness gate
        run: php artisan erp:readiness

      - name: Focused actual production quantity tests
        run: |
          php artisan test tests/Feature/Production/ActualProductionQuantityUiContractTest.php
          php artisan test tests/Feature/Production/ProductionOrderStartProductionFkCostRegressionTest.php
          php artisan test tests/Feature/CartonSpecification/CartonSpecificationServiceTest.php
          php artisan test tests/Feature/CartonSpecification/CartonQuotationTest.php
          php artisan test tests/Feature/Inventory/ReelRemnantTrackingTest.php
          php artisan test tests/Feature/Inventory/StockControlNotificationTest.php
          php artisan test tests/Feature/Inventory/StockNotificationHardeningTest.php
          php artisan test tests/Feature/GoldenPath/RealWorldCartonWorkflowRemediationTest.php
          php artisan test tests/Feature/Uat/RealClientCnpWorkflowTest.php
          php artisan test tests/Feature/ClientMaster/CustomerCartonMasterSeederTest.php
          php artisan test tests/Feature/ClientRequirements/SaleOrderModernUiContractTest.php
          php artisan test tests/Feature/BusinessUnits/BusinessUnitSwitchingTest.php
          php artisan test tests/Feature/Enterprise/BusinessUnitAccessControlTest.php
          php artisan test tests/Feature/Enterprise/BomGovernanceTest.php
          php artisan test tests/Feature/Enterprise/AccountingControlTest.php
          php artisan test tests/Feature/Enterprise/ProductionCostVarianceTest.php
          php artisan test tests/Feature/Enterprise/EnterpriseControlUiContractTest.php
          php artisan test tests/Feature/Enterprise/EnterpriseReadinessTest.php

      - name: Complete PHP test suite
        run: php artisan test

      - name: Composer security audit
        run: composer audit --no-interaction
